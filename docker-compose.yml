services:
  mysql:
    image: mysql:8.4
    container_name: pangeas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pangeas}
      MYSQL_USER: ${MYSQL_USER:-pangeas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pangeas}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - pangeas_mysql_data:/var/lib/mysql

volumes:
  pangeas_mysql_data:
